<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة تجهيزات المهندس</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#060c18">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #060c18; 
            --card: #0d1726; 
            --gold: #d4af37; 
            --text: #ffffff; 
            --input-bg: #111e33;
            --border: #1a2a40;
            --success: #2ecc71;
            --warning: #f1c40f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Tajawal', sans-serif; 
            padding: 20px 15px;
            min-height: 100vh;
        }
        .login-box { 
            max-width: 380px; 
            margin: 60px auto; 
            background: var(--card); 
            padding: 35px 25px; 
            border-radius: 18px; 
            text-align: center; 
            border: 1px solid var(--gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .pin-input { 
            width: 80%; 
            padding: 14px; 
            font-size: 1.8rem; 
            text-align: center; 
            border-radius: 10px; 
            border: 1px solid var(--gold); 
            margin: 20px 0; 
            background: var(--input-bg); 
            color: white; 
            letter-spacing: 5px;
        }
        .admin-panel { display: none; max-width: 800px; margin: 0 auto; }
        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-bottom: 25px; 
        }
        .stat-card { 
            background: var(--card); 
            padding: 20px 15px; 
            border-radius: 14px; 
            border: 1px solid var(--border); 
            text-align: center; 
        }
        .stat-num { font-size: 2.2rem; color: var(--gold); font-weight: 800; margin-top: 5px; }
        .tab-btns { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab-btn { 
            flex: 1; 
            padding: 14px; 
            background: var(--card); 
            color: var(--text); 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 1rem;
            transition: all 0.3s;
        }
        .tab-btn.active { 
            background: var(--gold); 
            color: var(--bg); 
            border-color: var(--gold);
        }
        .item-card { 
            background: var(--card); 
            padding: 18px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            border: 1px solid var(--border); 
            line-height: 1.7;
        }
        .item-title { font-size: 1.1rem; color: var(--gold); font-weight: bold; margin-bottom: 6px; }
        .item-sub { font-size: 0.9rem; opacity: 0.85; margin-bottom: 8px; }
        .status-wrapper { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
        select.status-select { 
            background: var(--input-bg); 
            color: var(--gold); 
            padding: 8px 12px; 
            border-radius: 8px; 
            border: 1px solid var(--gold); 
            font-weight: bold; 
            font-size: 0.9rem;
            cursor: pointer;
        }
        .btn { 
            background: var(--gold); 
            color: var(--bg); 
            border: none; 
            padding: 14px; 
            border-radius: 10px; 
            font-weight: bold; 
            width: 100%; 
            font-size: 1.05rem;
            cursor: pointer; 
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .refresh-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            float: left;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- شاشة قفل التطبيق (PIN) -->
    <div class="login-box" id="loginBox">
        <h2 style="color: var(--gold); font-size: 1.6rem;">تطبيق الإدارة 🔐</h2>
        <p style="font-size: 0.9rem; margin-top: 8px; opacity: 0.8;">ادخل الرمز السري للوصول إلى لوحة التحكم</p>
        <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••">
        <button class="btn" onclick="checkPin()">دخول اللوحة</button>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div class="admin-panel" id="adminPanel">
        <div style="overflow: hidden; margin-bottom: 20px;">
            <button class="refresh-btn" onclick="loadAdminData()">🔄 تحديث البيانات</button>
            <h2 style="color: var(--gold); font-size: 1.5rem;">لوحة تحكم النظام 👑</h2>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div>إجمالي الدفعات</div>
                <div class="stat-num" id="totalBatches">0</div>
            </div>
            <div class="stat-card">
                <div>الطلبات الفردية</div>
                <div class="stat-num" id="totalOrders">0</div>
            </div>
        </div>

        <div class="tab-btns">
            <button class="tab-btn active" id="btnTabBatches" onclick="switchTab('batchesTab', this)">إدارة الدفعات</button>
            <button class="tab-btn" id="btnTabOrders" onclick="switchTab('ordersTab', this)">الطلبات الفردية</button>
        </div>

        <!-- قسم إدارة الدفعات -->
        <div id="batchesTab">
            <div id="batchesList">جاري جلب الدفعات...</div>
        </div>

        <!-- قسم إدارة الطلبات الفردية -->
        <div id="ordersTab" style="display: none;">
            <div id="ordersList">جاري جلب الطلبات...</div>
        </div>
    </div>

    <script>
        const ADMIN_PIN = "1234"; // 🔑 يمكنك تغيير الرمز السري من هنا
        const VERCEL_ADMIN_API = '/api/admin';

        function checkPin() {
            const pin = document.getElementById('pinInput').value;
            if (pin === ADMIN_PIN) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadAdminData();
            } else {
                alert("الرمز السري غير صحيح!");
            }
        }

        function switchTab(tabId, btn) {
            document.getElementById('batchesTab').style.display = 'none';
            document.getElementById('ordersTab').style.display = 'none';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).style.display = 'block';
            btn.classList.add('active');
        }

        async function loadAdminData() {
            try {
                document.getElementById('batchesList').innerHTML = 'جاري التحميل...';
                document.getElementById('ordersList').innerHTML = 'جاري التحميل...';

                const res = await fetch(VERCEL_ADMIN_API);
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('totalBatches').innerText = data.batches.length;
                    document.getElementById('totalOrders').innerText = data.orders.length;

                    // 1️⃣ عرض الدفعات
                    let batchesHTML = '';
                    data.batches.forEach(b => {
                        batchesHTML += `
                            <div class="item-card">
                                <div class="item-title">🏷️ كود الدفعة: ${b.batchCode}</div>
                                <div class="item-sub">🏫 <b>الكلية:</b> ${b.uniName} - ${b.collName} (${b.deptName})</div>
                                <div class="item-sub">👤 <b>الممثل:</b> ${b.repName} | 📱 ${b.repPhone}</div>
                                <div class="item-sub">🧵 <b>الموديل:</b> ${b.batchModel} | <b>القماش:</b> ${b.batchFabric}</div>
                                ${b.sashFixedText ? `<div class="item-sub">📌 <b>الطرف الثابت:</b> ${b.sashFixedText}</div>` : ''}
                                <div class="status-wrapper">
                                    <span>تحديث الحالة:</span>
                                    <select class="status-select" onchange="updateBatchStatus('${b.batchCode}', this.value)">
                                        <option value="قيد الانضمام" ${b.status==='قيد الانضمام'?'selected':''}>قيد الانضمام</option>
                                        <option value="جاري التطريز والتنفيذ" ${b.status==='جاري التطريز والتنفيذ'?'selected':''}>جاري التطريز والتنفيذ</option>
                                        <option value="مكتمل ومسلم" ${b.status==='مكتمل ومسلم'?'selected':''}>مكتمل ومسلم</option>
                                    </select>
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('batchesList').innerHTML = batchesHTML || '<div class="item-card">لا توجد دفعات حالياً</div>';

                    // 2️⃣ عرض الطلبات الفردية
                    let ordersHTML = '';
                    data.orders.forEach(o => {
                        ordersHTML += `
                            <div class="item-card">
                                <div class="item-title">🎓 الطالب: ${o.studentName}</div>
                                <div class="item-sub">🔑 <b>كود الدفعة:</b> ${o.batchCode}</div>
                                <div class="item-sub">✏️ <b>التطريز الأساسي:</b> ${o.sashText}</div>
                                ${o.sashBackText && o.sashBackText !== 'لم يكتب شيء' ? `<div class="item-sub">📜 <b>ظهر الوشاح:</b> ${o.sashBackText}</div>` : ''}
                                ${o.capTopText && o.capTopText !== 'لم يكتب شيء' ? `<div class="item-sub">🧢 <b>اعلى القبعة:</b> ${o.capTopText}</div>` : ''}
                                ${o.capSideText && o.capSideText !== 'لم يكتب شيء' ? `<div class="item-sub">🧢 <b>جانب القبعة:</b> ${o.capSideText}</div>` : ''}
                                <div class="item-sub">➕ <b>الإضافات:</b> ${o.additions || 'لا توجد'}</div>
                                <div class="status-wrapper">
                                    <span>حالة الطلب:</span>
                                    <select class="status-select" onchange="updateOrderStatus('${o.id}', this.value)">
                                        <option value="قيد المراجعة" ${o.status==='قيد المراجعة'?'selected':''}>قيد المراجعة</option>
                                        <option value="قيد التطريز" ${o.status==='قيد التطريز'?'selected':''}>قيد التطريز</option>
                                        <option value="جاهز للتسليم" ${o.status==='جاهز للتسليم'?'selected':''}>جاهز للتسليم</option>
                                    </select>
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('ordersList').innerHTML = ordersHTML || '<div class="item-card">لا توجد طلبات فردية</div>';
                }
            } catch (err) {
                console.error(err);
                alert("حدث خطأ أثناء تحميل البيانات من السيرفر.");
            }
        }

        async function updateBatchStatus(batchCode, newStatus) {
            try {
                const res = await fetch(VERCEL_ADMIN_API, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ type: 'UPDATE_BATCH', batchCode, status: newStatus })
                });
                const data = await res.json();
                if(data.success) alert("تم تحديث حالة الدفعة بنجاح");
            } catch(e) { alert("فشل تحديث حالة الدفعة"); }
        }

        async function updateOrderStatus(orderId, newStatus) {
            try {
                const res = await fetch(VERCEL_ADMIN_API, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ type: 'UPDATE_ORDER', orderId, status: newStatus })
                });
                const data = await res.json();
                if(data.success) alert("تم تحديث حالة الطلب بنجاح");
            } catch(e) { alert("فشل تحديث حالة الطلب"); }
        }
    </script>
</body>
</html>
